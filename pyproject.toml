[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mijia-desktop"
version = "1.0.0"
description = "A lightweight Windows desktop control center for Mijia devices."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
authors = [{ name = "Mijia Desktop contributors" }]
dependencies = [
    "mijiaAPI>=4.1,<5",
    "PySide6>=6.8,<7",
    "pywin32>=310; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-qt>=4.4,<5",
]
packaging = [
    "pyinstaller>=6.15,<7",
]

[project.gui-scripts]
mijia-desktop = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
